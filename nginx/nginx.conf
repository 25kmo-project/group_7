events {}

http {
    server {
        listen 80;
        server_name bankg7.tech www.bankg7.tech;

        # Let's Encryptin varmistusta varten
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Ohjaa kaikki muu HTTP-liikenne HTTPS:ään
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name bankg7.tech www.bankg7.tech;

        # Sertifikaattien polut (Certbot luo nämä)
        ssl_certificate     /etc/letsencrypt/live/bankg7.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bankg7.tech/privkey.pem;

        # Turva-asetukset
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
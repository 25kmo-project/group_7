services:
  db:
    image: mysql:8.0
    container_name: bank_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Helsinki
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/1_init.sql:ro
      - ./db/schema/er_bankdb.sql:/docker-entrypoint-initdb.d/2_er_bankdb.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6
      #start_period: 40s
    restart: unless-stopped

  app:
    image: ${DOCKERHUB_USERNAME}/bank-backend:latest
    container_name: bank_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TZ: Europe/Helsinki
    depends_on:
      db:
        condition: service_healthy
    #ports:
    #  - "3000:3000"   # Julkinen API-portti VM:llä
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: bank_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:


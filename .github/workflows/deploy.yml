name: Build backend image

on:
  push:
    branches: ["actions"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/group7-backend:latest ./backend

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/group7-backend:latest

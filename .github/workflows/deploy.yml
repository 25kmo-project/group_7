name: CI/CD for Bank ATM

on:
  push:
    branches: [ actions ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bank-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bank-backend:${{ github.sha }}

  test-backend:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create bank-net

      - name: Start MySQL container
        run: |
          docker run -d --name bank-db \
            --network bank-net \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=bank_db \
            mysql:8.0

      - name: Wait for MySQL
        run: sleep 15 

  copy-files:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup VM directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /opt/bank-app/db/schema
            sudo chown -R $USER:$USER /opt/bank-app

      - name: Copy SQL Schema
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "db/schema/er_bankdb.sql,db/init.sql"
          target: "/opt/bank-app/db/"

      - name: Copy Docker Compose
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/bank-app/"

  deploy:
    runs-on: ubuntu-latest
    needs: copy-files
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/bank-app
            docker-compose pull
            docker-compose up -d
            docker system prune -f